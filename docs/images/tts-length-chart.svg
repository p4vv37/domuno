<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img" aria-labelledby="title desc">
<title id="title">Polish Pocket TTS on Arduino VENTUNO Q</title>
<desc id="desc">Median client-side latency of five warm runs per input. First PCM: 0.22, 0.60, 0.47 seconds. Complete PCM: 0.91, 2.86, 4.95 seconds.</desc>
<rect width="920" height="380" fill="#f8fafc"/>
<g font-family="Noto Sans, sans-serif" fill="#17263c">
<text x="34" y="49" font-size="30" font-weight="700">Polish Pocket TTS on Arduino VENTUNO Q</text>
<text x="34" y="80" font-size="16">Median of five warm runs per input · Wyoming loopback, not speaker playback</text>
<text x="34" y="113" fill="#3254bd" font-size="16">■ First PCM</text>
<text x="177" y="113" fill="#007969" font-size="16">■ Complete PCM</text>
<path d="M 210 135 V 325" stroke="#d6dee8"/>
<text x="210" y="353" text-anchor="middle" font-size="15">0 s</text>
<path d="M 328 135 V 325" stroke="#d6dee8"/>
<text x="328" y="353" text-anchor="middle" font-size="15">1 s</text>
<path d="M 446 135 V 325" stroke="#d6dee8"/>
<text x="446" y="353" text-anchor="middle" font-size="15">2 s</text>
<path d="M 564 135 V 325" stroke="#d6dee8"/>
<text x="564" y="353" text-anchor="middle" font-size="15">3 s</text>
<path d="M 682 135 V 325" stroke="#d6dee8"/>
<text x="682" y="353" text-anchor="middle" font-size="15">4 s</text>
<path d="M 800 135 V 325" stroke="#d6dee8"/>
<text x="800" y="353" text-anchor="middle" font-size="15">5 s</text>
<text x="34" y="166" font-size="17" font-weight="700">Short</text>
<text x="34" y="185" font-size="14">2.92 s of audio</text>
<rect x="210" y="149" width="25.96" height="17" fill="#3254bd" rx="2"/>
<text x="243.96" y="163" font-size="15">0.22 s</text>
<rect x="210" y="172" width="107.38" height="17" fill="#007969" rx="2"/>
<text x="325.38" y="186" font-size="15">0.91 s</text>
<text x="34" y="228" font-size="17" font-weight="700">Medium</text>
<text x="34" y="247" font-size="14">8.84 s of audio</text>
<rect x="210" y="211" width="70.8" height="17" fill="#3254bd" rx="2"/>
<text x="288.80" y="225" font-size="15">0.60 s</text>
<rect x="210" y="234" width="337.48" height="17" fill="#007969" rx="2"/>
<text x="555.48" y="248" font-size="15">2.86 s</text>
<text x="34" y="290" font-size="17" font-weight="700">Long</text>
<text x="34" y="309" font-size="14">15.80 s of audio</text>
<rect x="210" y="273" width="55.46" height="17" fill="#3254bd" rx="2"/>
<text x="273.46" y="287" font-size="15">0.47 s</text>
<rect x="210" y="296" width="584.1" height="17" fill="#007969" rx="2"/>
<text x="802.10" y="310" font-size="15">4.95 s</text>
</g>
</svg>
