services:
  fix-permissions:
    image: ghcr.io/ohf-voice/linux-voice-assistant:1.1.18
    entrypoint: []
    command: "chown -R ${LVA_USER_ID:-1000}:${LVA_USER_GROUP:-1000} /app/local /app/configuration /app/wakewords/custom /app/sounds/custom"
    volumes:
      - wakeword_data:/app/local
      - wakeword_custom:/app/wakewords/custom
      - configuration:/app/configuration
      - sounds_custom:/app/sounds/custom
    restart: "no"

  linux-voice-assistant:
    image: ghcr.io/ohf-voice/linux-voice-assistant:1.1.18
    container_name: linux-voice-assistant
    restart: unless-stopped
    network_mode: host
    user: "${LVA_USER_ID:-1000}:${LVA_USER_GROUP:-1000}"
    group_add: [audio]
    cap_add: [SYS_NICE]
    environment:
      XDG_RUNTIME_DIR: /run/user/${LVA_USER_ID:-1000}
      PULSE_SERVER: /run/user/${LVA_USER_ID:-1000}/pulse/native
      PULSE_COOKIE: /run/user/${LVA_USER_ID:-1000}/pulse/cookie
      AUDIO_INPUT_DEVICE: ${AUDIO_INPUT_DEVICE:-default}
      AUDIO_OUTPUT_DEVICE: ${AUDIO_OUTPUT_DEVICE:-pulse}
      LIST_DEVICES: ${LIST_DEVICES:-}
      WAKE_MODEL: okay_nabu
    volumes:
      - wakeword_data:/app/local
      - wakeword_custom:/app/wakewords/custom
      - configuration:/app/configuration
      - sounds_custom:/app/sounds/custom
      - /run/user/${LVA_USER_ID:-1000}:/run/user/${LVA_USER_ID:-1000}
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      fix-permissions:
        condition: service_completed_successfully

volumes:
  wakeword_data:
  wakeword_custom:
  configuration:
  sounds_custom:
